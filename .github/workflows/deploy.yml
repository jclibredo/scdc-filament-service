name: Deploy Laravel Filament to Hostinger

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Mark directory safe for Git
            git config --global --add safe.directory /home/u164809439/domains/scdc-web-app.com/laravel-app

            cd ~/domains/scdc-web-app.com/laravel-app

            # Put app in maintenance mode
            php artisan down || true

            # Force reset tracked files AND remove untracked files (fixes cron.sh issue)
            git reset --hard HEAD
            git clean -fd
            git pull origin master

            # 1. Clear old Filament & framework caches FIRST
            php artisan optimize:clear
            php artisan filament:optimize-clear || true

            # 2. Install dependencies without scripts
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts

            # 3. Discover packages, upgrade assets, & run migrations
            php artisan package:discover
            php artisan filament:upgrade
            php artisan storage:link || true
            php artisan migrate --force

            # 4. Build Frontend Assets (Vite/Tailwind)
            if command -v npm &> /dev/null; then
              npm ci
              npm run build
            fi

            # 5. Rebuild framework & Filament caches
            php artisan config:cache
            php artisan event:cache
            php artisan filament:optimize

            # 6. Flush Web Server OPcache
            touch public/index.php

            # 7. Restart queue worker
            php artisan queue:restart

            # Bring app back online
            php artisan up
